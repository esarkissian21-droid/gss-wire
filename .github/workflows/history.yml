name: Fetch price history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["history/tickers.txt", "history/fetch_history.py", "history/fetch_long.py"]

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 history/fetch_history.py
      - run: pip install -q openpyxl && python3 history/fetch_long.py
      - name: Commit data
        run: |
          git config user.name "gss-wire-bot"
          git config user.email "gss-wire-bot@users.noreply.github.com"
          git add history/data history/long
          git diff --cached --quiet && exit 0
          git commit -m "History data refresh"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
