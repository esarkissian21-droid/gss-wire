name: wire

on:
  schedule:
    # Times are UTC. Pacific = UTC-8 in winter (UTC-7 in summer, so everything shifts an hour later).
    # Private repos get 2,000 free Actions minutes a month; this schedule uses about 1,300.
    - cron: "*/20 12-23 * * 1-5"         # Mon-Fri 4:00 a.m.-3:40 p.m. PT: every 20 minutes
    - cron: "*/20 0-2 * * 2-6"           # Mon-Fri 4:00-6:40 p.m. PT (after-hours filings): every 20 minutes
    - cron: "7 1,3,5,7,9,11 * * 1-6"     # overnight: every 2 hours
    - cron: "7 */2 * * 0,6"              # weekends: every 2 hours
  workflow_dispatch: {}                  # lets you press "Run workflow" by hand

permissions:
  contents: write           # saves state.json and wire_log.jsonl back to the repo

concurrency:
  group: wire
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Check filings, the Fed and headlines
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python3 wire.py

      - name: Save what was seen
        run: |
          git config user.name "gss-wire"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json wire_log.jsonl
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -q -m "wire: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase && git push -q
          fi
